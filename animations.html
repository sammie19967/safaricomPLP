<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Webpage</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        .container {
            margin-top: 50px;
        }

        /* Button with Transition */
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        /* Animated Spinner */
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin-top: 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }

        /* Card Animation */
        .card {
            width: 200px;
            height: 300px;
            margin: 20px;
            background-color: #4CAF50;
            color: white;
            display: inline-block;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .card:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>Interactive Webpage with CSS3 Transitions and JavaScript Functions</h1>

    <div class="container">
        <!-- Button with Transition -->
        <button class="btn" id="toggleBtn">Click Me to Change Background</button>

        <!-- Animated Spinner -->
        <div class="spinner" id="spinner"></div>

        <!-- Modal -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <h2>Modal</h2>
                <p>This is an animated modal. Close it by clicking the button below.</p>
                <button onclick="toggleModal()">Close Modal</button>
            </div>
        </div>

        <!-- Card Animation -->
        <div class="card" id="card" onclick="triggerCardAnimation()">Click Me to Trigger Animation</div>
    </div>

    <script>
        // Part 1: JavaScript Functions

        // Function with Parameters and Return Value: Calculate the area of a rectangle
        function calculateArea(length, width) {
            return length * width;
        }

        // Example usage of calculateArea:
        console.log("Area of rectangle: " + calculateArea(5, 10)); // Output: 50

        // Function to demonstrate Local vs Global Scope
        let globalVar = "I am a global variable"; // Global variable

        function demoScope() {
            let localVar = "I am a local variable"; // Local variable
            console.log(globalVar); // Accessing global variable
            console.log(localVar);  // Accessing local variable
        }

        demoScope();

        // Function to toggle the modal visibility
        function toggleModal() {
            const modal = document.getElementById("modal");
            modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
        }

        // Function to toggle the background color of the webpage
        let isDarkMode = false;
        document.getElementById("toggleBtn").addEventListener("click", function () {
            isDarkMode = !isDarkMode;
            document.body.style.backgroundColor = isDarkMode ? "#333" : "#f0f0f0";
            document.body.style.color = isDarkMode ? "#fff" : "#333";
        });

        // Part 2: Combining CSS Animations with JavaScript

        // Trigger Card Animation when clicked
        function triggerCardAnimation() {
            const card = document.getElementById("card");
            card.style.transition = "transform 0.3s ease-in-out";
            card.style.transform = "rotateY(180deg)"; // Rotate the card
            setTimeout(function () {
                card.style.transform = "rotateY(0deg)"; // Reset after animation
            }, 300);
        }
    </script>

</body>
</html>
